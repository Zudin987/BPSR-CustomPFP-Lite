name: Build Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bpsr-stable-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      exe_name: ${{ steps.version.outputs.exe_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"

      - name: Resolve application version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "src/app.py" -Pattern '^VERSION = "([^"]+)"$'
          if (-not $match) { throw "Could not read VERSION from src/app.py" }
          $version = $match.Matches[0].Groups[1].Value
          $exeName = "BPSR-CustomPFP-Lite-v$version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exe_name=$exeName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building $exeName"

      - name: Prepare Windows icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; im=Image.open('assets/app_icon.png').convert('RGBA').resize((256,256), Image.Resampling.LANCZOS); im.save('assets/app_icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name $env:EXE_NAME `
            --icon assets/app_icon.ico `
            --add-data "assets/app_icon.png;assets" `
            --collect-all UnityPy `
            --collect-all fmod_toolkit `
            --collect-all archspec `
            --collect-all PIL `
            src/app.py

      - name: Verify frozen dependencies
        shell: pwsh
        run: |
          $exe = ".\dist\$env:EXE_NAME.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen dependency self-test failed with exit code $($process.ExitCode)."
          }

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\$env:EXE_NAME.exe" release\
          Copy-Item README.md release\
          Copy-Item THIRD_PARTY_NOTICES.md release\
          Compress-Archive -Path release\* -DestinationPath BPSR-CustomPFP-Lite-Windows.zip -Force

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPSR-CustomPFP-Lite-v${{ env.APP_VERSION }}-Windows
          path: |
            dist/${{ env.EXE_NAME }}.exe
            BPSR-CustomPFP-Lite-Windows.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.build.outputs.app_version }}
      EXE_NAME: ${{ needs.build.outputs.exe_name }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Download validated build artifact
        uses: actions/download-artifact@v4
        with:
          name: BPSR-CustomPFP-Lite-v${{ needs.build.outputs.app_version }}-Windows
          path: release-artifact

      - name: Publish stable version release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $exeItem = Get-ChildItem release-artifact -Recurse -File -Filter "$env:EXE_NAME.exe" | Select-Object -First 1
          $zipItem = Get-ChildItem release-artifact -Recurse -File -Filter "BPSR-CustomPFP-Lite-Windows.zip" | Select-Object -First 1
          if (-not $exeItem) { throw "Validated EXE artifact was not found." }
          if (-not $zipItem) { throw "Validated ZIP artifact was not found." }
          $exe = $exeItem.FullName
          $zip = $zipItem.FullName

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            $remoteSha = ($existing -split "\s+")[0]
            if ($remoteSha -ne $env:GITHUB_SHA) {
              Write-Host "Version $tag is already released from another commit. Build validation passed, but publishing is skipped. Bump VERSION to publish a new release."
              exit 0
            }
          } else {
            git tag $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag"
          }

          $notes = @"
          BPSR Custom PFP Lite $tag — stable Windows release.

          Release assets:
          - $env:EXE_NAME.exe — standalone Windows application.
          - BPSR-CustomPFP-Lite-Windows.zip — EXE plus README and third-party notices.

          Highlights:
          - Guided Square and Card custom-picture workflow.
          - Automatic game-folder and picture-slot detection with manual fallbacks.
          - Built-in crop/reposition, backup/restore, and BPSR window-resize helpers.
          - Frozen dependency self-test before publishing.

          This is an unofficial client-file modification. Read the README before use.
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $zip --clobber
            gh release edit $tag --title "BPSR Custom PFP Lite $tag" --notes $notes --latest
          } else {
            gh release create $tag $exe $zip --title "BPSR Custom PFP Lite $tag" --notes $notes --latest
          }
