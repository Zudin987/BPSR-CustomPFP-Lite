name: Build Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bpsr-stable-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      exe_name: ${{ steps.version.outputs.exe_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==6.22.2"
          pip check

      - name: Compile and run safety tests
        shell: pwsh
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v

      - name: Resolve application version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "src/settings.py" -Pattern '^VERSION = "([^"]+)"$'
          if (-not $match) { throw "Could not read VERSION from src/settings.py" }
          $version = $match.Matches[0].Groups[1].Value
          if (-not (Select-String -Path "CHANGELOG.md" -Pattern "^## $([regex]::Escape($version))\b")) {
            throw "CHANGELOG.md does not contain a heading for version $version"
          }
          $exeName = "BPSR-CustomPFP-Lite-v$version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exe_name=$exeName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building $exeName"

      - name: Prepare Windows icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; im=Image.open('assets/app_icon.png').convert('RGBA').resize((256,256), Image.Resampling.LANCZOS); im.save('assets/app_icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name $env:EXE_NAME `
            --icon assets/app_icon.ico `
            --add-data "assets/app_icon.png;assets" `
            --collect-all UnityPy `
            --collect-all fmod_toolkit `
            --collect-all archspec `
            --collect-all PIL `
            src/app.py

      - name: Verify frozen dependencies
        shell: pwsh
        run: |
          $exe = ".\dist\$env:EXE_NAME.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen dependency self-test failed with exit code $($process.ExitCode)."
          }

      - name: Package ZIP and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\$env:EXE_NAME.exe" release\
          Copy-Item README.md release\
          Copy-Item CHANGELOG.md release\
          Copy-Item THIRD_PARTY_NOTICES.md release\
          Compress-Archive -Path release\* -DestinationPath BPSR-CustomPFP-Lite-Windows.zip -Force

          $exeHash = (Get-FileHash "dist\$env:EXE_NAME.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "BPSR-CustomPFP-Lite-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  $env:EXE_NAME.exe",
            "$zipHash  BPSR-CustomPFP-Lite-Windows.zip"
          ) | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPSR-CustomPFP-Lite-v${{ env.APP_VERSION }}-Windows
          path: |
            dist/${{ env.EXE_NAME }}.exe
            BPSR-CustomPFP-Lite-Windows.zip
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.build.outputs.app_version }}
      EXE_NAME: ${{ needs.build.outputs.exe_name }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Download validated build artifact
        uses: actions/download-artifact@v4
        with:
          name: BPSR-CustomPFP-Lite-v${{ needs.build.outputs.app_version }}-Windows
          path: release-artifact

      - name: Publish stable version release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $exeItem = Get-ChildItem release-artifact -Recurse -File -Filter "$env:EXE_NAME.exe" | Select-Object -First 1
          $zipItem = Get-ChildItem release-artifact -Recurse -File -Filter "BPSR-CustomPFP-Lite-Windows.zip" | Select-Object -First 1
          $sumItem = Get-ChildItem release-artifact -Recurse -File -Filter "SHA256SUMS.txt" | Select-Object -First 1
          if (-not $exeItem) { throw "Validated EXE artifact was not found." }
          if (-not $zipItem) { throw "Validated ZIP artifact was not found." }
          if (-not $sumItem) { throw "Validated checksum file was not found." }

          $exe = $exeItem.FullName
          $zip = $zipItem.FullName
          $sums = $sumItem.FullName

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            $remoteSha = ($existing -split "\s+")[0]
            if ($remoteSha -ne $env:GITHUB_SHA) {
              throw "Version $tag is already published from another commit. Bump VERSION before merging source changes."
            }
          } else {
            git tag $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag"
          }

          $notes = @"
          BPSR Custom PFP Lite $tag — safety + beginner UI/UX hardening.

          Highlights:
          - Six baby-step beginner workflow with active-session locking and recovery guidance.
          - Install-specific transactional backups with safe restore refusal.
          - Original UnityFS compression preservation and verified atomic package commit.
          - Original-image recropping, EXIF orientation, DPI-aware exact window helpers.
          - Faster known m79/file593/bg_3 probe with safe fallback scanning.
          - Automated safety tests and SHA-256 release checksums.

          Release assets:
          - $env:EXE_NAME.exe — standalone Windows application.
          - BPSR-CustomPFP-Lite-Windows.zip — EXE plus README, changelog, and notices.
          - SHA256SUMS.txt — SHA-256 checksums for both downloadable binaries.

          This is an unofficial client-file modification and is not guaranteed ban-safe.
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $zip $sums --clobber
            gh release edit $tag --title "BPSR Custom PFP Lite $tag" --notes $notes --latest
          } else {
            gh release create $tag $exe $zip $sums --title "BPSR Custom PFP Lite $tag" --notes $notes --latest
          }
