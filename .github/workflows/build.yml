name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bpsr-windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"

      - name: Prepare Windows icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; im=Image.open('assets/app_icon.png').convert('RGBA').resize((256,256), Image.Resampling.LANCZOS); im.save('assets/app_icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name BPSR-CustomPFP-Lite-v0.3.4 `
            --icon assets/app_icon.ico `
            --add-data "assets/app_icon.png;assets" `
            --collect-all UnityPy `
            --collect-all fmod_toolkit `
            --collect-all archspec `
            --collect-all PIL `
            src/app.py

      - name: Verify frozen dependencies
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\BPSR-CustomPFP-Lite-v0.3.4.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen dependency self-test failed with exit code $($process.ExitCode)."
          }

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/BPSR-CustomPFP-Lite-v0.3.4.exe release/
          Copy-Item README.md release/
          Copy-Item THIRD_PARTY_NOTICES.md release/
          Compress-Archive -Path release/* -DestinationPath BPSR-CustomPFP-Lite-Windows.zip -Force

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPSR-CustomPFP-Lite-Windows
          path: BPSR-CustomPFP-Lite-Windows.zip

      - name: Publish/update Latest release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest $env:GITHUB_SHA
          git push -f origin refs/tags/latest
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload latest BPSR-CustomPFP-Lite-Windows.zip --clobber
          } else {
            gh release create latest BPSR-CustomPFP-Lite-Windows.zip --title "Latest Windows build" --notes "Standalone Windows build. No Python installation is required." --latest
          }
