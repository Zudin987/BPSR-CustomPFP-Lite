name: Prepare v1.0.0

on:
  push:
    paths:
      - '.github/workflows/bump-v1.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set application version to 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app.py')
          s = p.read_text(encoding='utf-8')
          old = 'VERSION = "0.3.5"'
          new = 'VERSION = "1.0.0"'
          if old not in s and new not in s:
              raise SystemExit('Expected VERSION line was not found')
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile src/app.py
      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.py
          if ! git diff --cached --quiet; then
            git commit -m "Bump application version to 1.0.0"
            git push
          fi
