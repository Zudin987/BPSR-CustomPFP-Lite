name: Apply v0.3.2 source hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source hotfix
        run: python tools/hotfix_v032.py
      - name: Validate Python syntax
        run: python -m py_compile src/app.py
      - name: Commit hotfix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.py
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "v0.3.2: fix archspec runtime, admin launch, and app icon"
          git push
