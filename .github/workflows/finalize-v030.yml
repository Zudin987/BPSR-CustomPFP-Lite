name: Finalize v0.3.0 source

on:
  push:
    branches: [feature/v0.3.0-radical-simplification]
    paths:
      - tools/finalize_v030.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.0-radical-simplification
      - name: Apply final logic patch
        run: python tools/finalize_v030.py
      - name: Validate Python syntax
        run: python -m py_compile src/app.py
      - name: Commit final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.py
          git diff --cached --quiet && exit 0
          git commit -m "Finalize v0.3.0 detection and crop safeguards"
          git push
